[package]
name = "pgplan"
version = "0.1.0"
edition = "2021"
description = "Fails a build when a query plan gets worse — a named, provable degradation, not a diff of EXPLAIN output"
license = "MIT"
repository = "https://github.com/Blahaj-gif/pgplan"
keywords = ["postgres", "explain", "query-plan", "regression", "ci"]
categories = ["command-line-utilities", "database", "development-tools"]
# Verified by CI, not guessed. See the note in pgseed's Cargo.toml for why this
# is a promise rather than a decoration.
rust-version = "1.85"
exclude = [".github/", "rust-toolchain.toml"]

[dependencies]
postgres = { version = "0.19", features = ["with-serde_json-1"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
postgresql_embedded = { version = "0.19", features = ["blocking", "bundled"] }

[profile.release]
strip = true
lto = true
opt-level = "z"
